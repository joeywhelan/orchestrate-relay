[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "orchestrate-relay"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "elasticsearch>=9.4.1",
    "ibm-watsonx-orchestrate>=2.13.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]
